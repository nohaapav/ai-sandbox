services:
  agent:
    image: ai-sandbox-agent:latest

    build:
      context: .
      dockerfile: Dockerfile
      target: agent

    working_dir: /workspace
    user: agent

    volumes:
      # Shared workspace
      - ${PROJECT_DIR}/gc:/workspace/gc
      - ${PROJECT_DIR}/web:/workspace/web
      - ${PROJECT_DIR}/evm:/workspace/evm

      # Persistent agent state
      - ./state/codex:/home/agent/.codex
      - ./state/claude:/home/agent/.claude
      - ./state/claude.json:/home/agent/.claude.json

      # Shared agent instructions (read-only)
      - ./config/AGENTS.md:/home/agent/.claude/CLAUDE.md:ro
      - ./config/AGENTS.md:/home/agent/.codex/AGENTS.md:ro

      # Persistent home / installed tooling
      - agent-home:/home/agent

    # Codex Unix sockets need a Linux filesystem
    tmpfs:
      - /home/agent/.codex/ipc:uid=1000,gid=1000,mode=700

    environment:
      CARGO_BUILD_JOBS: 4

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    mem_limit: 8g
    cpus: 4
    pids_limit: 4096

    init: true
    stdin_open: true
    tty: true
    command: sleep infinity

  deploy:
    image: ai-sandbox-deploy:latest

    build:
      context: .
      dockerfile: Dockerfile
      target: deploy

    working_dir: /workspace
    user: agent

    volumes:
      # Same writable workspace
      - ${PROJECT_DIR}/gc:/workspace/gc
      - ${PROJECT_DIR}/web:/workspace/web
      - ${PROJECT_DIR}/evm:/workspace/evm

      # Same installed Node.js, Foundry, Rust, mise, etc.
      - agent-home:/home/agent

    # Hide vscode & agents
    tmpfs:
    - /home/agent/.vscode-server:uid=1000,gid=1000,mode=700
    - /home/agent/.codex:uid=1000,gid=1000,mode=700
    - /home/agent/.claude:uid=1000,gid=1000,mode=700

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    mem_limit: 8g
    cpus: 4
    pids_limit: 4096

    init: true
    stdin_open: true
    tty: true
    command: sleep infinity

volumes:
  agent-home: